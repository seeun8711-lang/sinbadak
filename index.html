<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>신바닥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
:root{--bg:#F7F7F7;--line:#BDBDBD;--btn:#111;--btnfg:#fff}
body.dark{--bg:#141414;--line:#555;--btn:#F2F2F2;--btnfg:#111}
#stage{position:fixed;inset:0;overflow:hidden}
.s{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none;user-select:none}
#slot{position:absolute;border:1.5px dashed var(--line);border-radius:6px;transition:opacity .4s}
#me{position:absolute;left:0;top:0;object-fit:cover;border-radius:50% / 30%;opacity:0;pointer-events:none;transform-origin:50% 50%}
#cam{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));width:68px;height:68px;margin-left:-34px;border-radius:50%;border:0;background:var(--btn);display:flex;align-items:center;justify-content:center;transition:opacity .4s,transform .2s}
#cam:active{transform:scale(.92)}
#cam.hide{opacity:0;pointer-events:none}
#cam svg{width:30px;height:30px;stroke:var(--btnfg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#file{display:none}
</style>
</head>
<body>
<div id="stage"><div id="slot"></div><img id="me" alt=""></div>
<button id="cam" aria-label="내 신바닥 찍어 올리기"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
<input id="file" type="file" accept="image/*" capture="environment">
<script src="matter.min.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.has('dark')) document.body.classList.add('dark');
if (Q.has('phone')) Object.assign(document.getElementById('stage').style, {right: 'auto', bottom: 'auto', width: '390px', height: '844px'});
const {Engine, Bodies, Composite, Body} = Matter;
const stage = document.getElementById('stage'), slot = document.getElementById('slot'),
      me = document.getElementById('me'), cam = document.getElementById('cam'), file = document.getElementById('file');
let W, H, soles = [], grid, busy = false;

// 시간표 (ms)
const LIFT = 450,                 // 격자에서 위로 빠져나감
      POUR = 500, GAP = 22,       // 위에서 한 장씩 쏟아짐
      ME_IN = POUR + 100*GAP + 300,
      SORT = ME_IN + 1500,        // 쌓인 더미에서 닳은 순서로 다시 줄
      STAG = 14, MOVE = 900,
      ME_GO = SORT + 99*STAG + MOVE - 300, ME_DUR = 1100,
      END = ME_GO + ME_DUR, DT = 1000/60;

// 10열 격자: 100장 + 101번째 빈자리
function layout() {
  W = stage.clientWidth; H = stage.clientHeight;
  const pad = 18, cols = 10, cell = (W - pad*2) / cols, rows = 11;
  const top = Math.max(pad, (H - 120 - cell*rows) / 2);
  grid = i => ({x: pad + (i % cols + .5)*cell, y: top + (Math.floor(i / cols) + .5)*cell, c: cell});
  const g = grid(100);
  Object.assign(slot.style, {left: g.x - g.c*.42 + 'px', top: g.y - g.c*.45 + 'px', width: g.c*.84 + 'px', height: g.c*.9 + 'px'});
}
function place(el, x, y, w, h, a = 0, sc = 1) {
  el.style.transform = `translate(${x - w/2}px,${y - h/2}px) rotate(${a}rad) scale(${sc})`;
}
const ease = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
const easeIn = u => Math.pow(Math.min(1, Math.max(0, u)), 2);
const lerp = (a, b, u) => a + (b - a)*u;
const norm = a => { a %= Math.PI*2; if (a > Math.PI) a -= Math.PI*2; if (a < -Math.PI) a += Math.PI*2; return a; };

function showGrid() {
  soles.forEach((o, i) => { const g = grid(i); place(o.el, g.x, g.y, o.pw, o.ph, 0, o.f); });
}

async function init() {
  const D = [{"no":1,"w":149,"h":360},{"no":2,"w":147,"h":360},{"no":3,"w":211,"h":360},{"no":4,"w":157,"h":360},{"no":5,"w":174,"h":360},{"no":6,"w":148,"h":360},{"no":7,"w":143,"h":360},{"no":8,"w":183,"h":360},{"no":9,"w":140,"h":360},{"no":10,"w":163,"h":360},{"no":11,"w":144,"h":360},{"no":12,"w":161,"h":360},{"no":13,"w":143,"h":360},{"no":14,"w":174,"h":360},{"no":15,"w":140,"h":360},{"no":16,"w":135,"h":360},{"no":17,"w":144,"h":360},{"no":18,"w":148,"h":360},{"no":19,"w":123,"h":360},{"no":20,"w":136,"h":360},{"no":21,"w":159,"h":360},{"no":22,"w":145,"h":360},{"no":23,"w":161,"h":360},{"no":24,"w":137,"h":360},{"no":25,"w":122,"h":359},{"no":26,"w":136,"h":360},{"no":27,"w":219,"h":360},{"no":28,"w":144,"h":360},{"no":29,"w":134,"h":360},{"no":30,"w":140,"h":360},{"no":31,"w":176,"h":360},{"no":32,"w":160,"h":360},{"no":33,"w":155,"h":360},{"no":34,"w":161,"h":360},{"no":35,"w":141,"h":360},{"no":36,"w":167,"h":359},{"no":37,"w":138,"h":360},{"no":38,"w":169,"h":360},{"no":39,"w":178,"h":360},{"no":40,"w":117,"h":360},{"no":41,"w":123,"h":360},{"no":42,"w":200,"h":360},{"no":43,"w":165,"h":360},{"no":44,"w":147,"h":360},{"no":45,"w":148,"h":359},{"no":46,"w":158,"h":360},{"no":47,"w":144,"h":360},{"no":48,"w":140,"h":360},{"no":49,"w":147,"h":360},{"no":50,"w":156,"h":360},{"no":51,"w":126,"h":360},{"no":52,"w":141,"h":360},{"no":53,"w":156,"h":360},{"no":54,"w":132,"h":360},{"no":55,"w":159,"h":360},{"no":56,"w":163,"h":360},{"no":57,"w":131,"h":360},{"no":58,"w":127,"h":360},{"no":59,"w":151,"h":360},{"no":60,"w":170,"h":360},{"no":61,"w":146,"h":360},{"no":62,"w":190,"h":360},{"no":63,"w":150,"h":360},{"no":64,"w":122,"h":360},{"no":65,"w":136,"h":360},{"no":66,"w":180,"h":360},{"no":67,"w":145,"h":360},{"no":68,"w":141,"h":360},{"no":69,"w":165,"h":360},{"no":70,"w":127,"h":360},{"no":71,"w":137,"h":360},{"no":72,"w":139,"h":360},{"no":73,"w":128,"h":360},{"no":74,"w":136,"h":359},{"no":75,"w":129,"h":360},{"no":76,"w":134,"h":360},{"no":77,"w":127,"h":360},{"no":78,"w":142,"h":360},{"no":79,"w":155,"h":360},{"no":80,"w":156,"h":360},{"no":81,"w":131,"h":360},{"no":82,"w":132,"h":360},{"no":83,"w":211,"h":360},{"no":84,"w":135,"h":360},{"no":85,"w":164,"h":360},{"no":86,"w":127,"h":360},{"no":87,"w":128,"h":360},{"no":88,"w":173,"h":360},{"no":89,"w":138,"h":360},{"no":90,"w":167,"h":360},{"no":91,"w":173,"h":360},{"no":92,"w":181,"h":360},{"no":93,"w":124,"h":360},{"no":94,"w":126,"h":360},{"no":95,"w":128,"h":360},{"no":96,"w":160,"h":360},{"no":97,"w":127,"h":360},{"no":98,"w":141,"h":360},{"no":99,"w":135,"h":360},{"no":100,"w":139,"h":360}];  // 밑창 100장 크기 (닳은 순서)
  layout();
  // 쌓일 때 크기: 100장 넓이 합이 화면의 약 55%
  const area = D.reduce((s, d) => s + d.w*d.h, 0), k = Math.sqrt(W*H*.55 / area);
  soles = D.map((d, i) => {
    const el = new Image(); el.src = `s/${String(d.no).padStart(3,'0')}.webp`; el.className = 's';
    const pw = d.w*k, ph = d.h*k; el.style.width = pw + 'px'; el.style.height = ph + 'px';
    stage.appendChild(el);
    return {d, el, pw, ph, f: grid(i).c*.9 / Math.max(pw, ph)};
  });
  showGrid();
  if (Q.has('demo') || Q.has('t')) start('s/demo.jpg');
}

function start(src) {
  busy = true; cam.classList.add('hide'); slot.style.opacity = 0;
  me.src = src; me.style.opacity = 0;
  const mw = W*.24, mh = mw*1.9;
  me.style.width = mw + 'px'; me.style.height = mh + 'px';

  const engine = Engine.create(); engine.gravity.y = 1.3;
  const wall = 300, opt = {isStatic: true};
  Composite.add(engine.world, [
    Bodies.rectangle(W/2, H + wall/2, W*3, wall, opt),
    Bodies.rectangle(-wall/2, -H, wall, H*5, opt),
    Bodies.rectangle(W + wall/2, -H, wall, H*5, opt)]);
  // 쏟아지는 순서는 섞음 (닳은 순서와 상관없이 뒤죽박죽 더미)
  const order = soles.map((_, i) => i).sort(() => Math.random() - .5);
  order.forEach((i, n) => { soles[i].spawn = POUR + n*GAP; soles[i].b = null; soles[i].el.style.zIndex = n; });
  const mb = Bodies.rectangle(W/2, -mh, mw*.9, mh*.95, {chamfer: {radius: mw*.42}, friction: .7, restitution: .1, density: .004});
  me.style.zIndex = 200;
  let sim = 0, frozen = false;

  function physicsTo(t) {
    while (sim + DT <= Math.min(t, SORT)) {
      sim += DT;
      soles.forEach(o => {
        if (!o.b && sim >= o.spawn) {
          o.b = Bodies.rectangle(W*(.15 + Math.random()*.7), -o.ph*.6, o.pw*.86, o.ph*.9,
            {chamfer: {radius: o.pw*.4}, friction: .6, restitution: .15, density: .002});
          Body.setAngle(o.b, (Math.random() - .5)*1.2);
          Body.setVelocity(o.b, {x: (Math.random() - .5)*5, y: 6 + Math.random()*4});
          Body.setAngularVelocity(o.b, (Math.random() - .5)*.3);
          Composite.add(engine.world, o.b);
        }
      });
      if (sim >= ME_IN && !mb.added) { mb.added = true; Composite.add(engine.world, mb); Body.setVelocity(mb, {x: 0, y: 8}); }
      Engine.update(engine, DT);
    }
    if (sim + DT > SORT && !frozen) {        // 더미 모양을 저장하고 물리 끝
      frozen = true;
      soles.forEach(o => { o.px = o.b.position.x; o.py = o.b.position.y; o.pa = norm(o.b.angle); });
      mb.px = mb.position.x; mb.py = mb.position.y; mb.pa = norm(mb.angle);
    }
  }

  function render(t) {
    physicsTo(t);
    soles.forEach((o, i) => {
      const g = grid(i);
      if (t < o.spawn) {                         // 격자 → 위로 빠져나감
        const u = easeIn((t - i*3) / LIFT);
        place(o.el, g.x, lerp(g.y, -o.ph, u), o.pw, o.ph, 0, lerp(o.f, 1, u));
      } else if (t < SORT) {                     // 쏟아지고 쌓임
        place(o.el, o.b.position.x, o.b.position.y, o.pw, o.ph, o.b.angle, 1);
      } else {                                   // 닳은 순서대로 제자리
        const u = ease((t - SORT - i*STAG) / MOVE);
        place(o.el, lerp(o.px, g.x, u), lerp(o.py, g.y, u), o.pw, o.ph, lerp(o.pa, 0, u), lerp(1, o.f, u));
      }
    });
    if (t >= ME_IN) {
      me.style.opacity = 1;
      const g = grid(100);
      if (t < SORT) place(me, mb.position.x, mb.position.y, mw, mh, mb.angle);
      else { const u = ease((t - ME_GO) / ME_DUR); place(me, lerp(mb.px, g.x, u), lerp(mb.py, g.y, u), mw, mh, lerp(mb.pa, 0, u), lerp(1, g.c*.9/mh, u)); }
    }
  }

  if (Q.has('t')) { render(+Q.get('t')); document.title = 'ready'; return; }
  const t0 = performance.now();
  (function loop(now) {
    const t = now - t0; render(Math.min(t, END));
    if (t < END) requestAnimationFrame(loop); else { busy = false; cam.classList.remove('hide'); }
  })(t0);
}

cam.onclick = () => { if (!busy) file.click(); };
file.onchange = () => {
  const f = file.files[0]; if (!f) return;
  showGrid(); start(URL.createObjectURL(f)); file.value = '';
};
init();
</script>
</body>
</html>
